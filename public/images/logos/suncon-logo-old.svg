<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-labelledby="suncon-logo-title">
  <title id="suncon-logo-title">SunCon Investments & Development Ltd Logo</title>
  
  <!-- Outer shield / hexagon-like frame with 3D bevel effect -->
  <defs>
    <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="50%" stop-color="#0D2B4A"/>
      <stop offset="100%" stop-color="#0A1F38"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#2E5A8F"/>
      <stop offset="100%" stop-color="#1A3F6B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Main outer shape (stylized S/G frame) -->
  <path d="M40 25 L160 25 Q185 50 185 85 Q185 130 155 155 L45 155 Q20 130 20 85 Q20 50 40 25 Z" 
        fill="url(#outerGrad)" stroke="#0A1F38" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Inner recessed area for buildings -->
  <path d="M48 38 L152 38 Q170 58 170 88 Q170 125 148 142 L52 142 Q30 125 30 88 Q30 58 48 38 Z" 
        fill="url(#innerGrad)" stroke="#3A6A9F" stroke-width="3"/>

  <!-- Stylized building towers integrated into the S/G -->
  <!-- Central tall tower cluster -->
  <rect x="78" y="52" width="12" height="78" fill="#0D2B4A" rx="1"/>
  <rect x="92" y="45" width="16" height="85" fill="#1A3F6B" rx="1"/>
  <rect x="110" y="55" width="11" height="75" fill="#0D2B4A" rx="1"/>
  
  <!-- Smaller accent towers / S curve elements -->
  <rect x="62" y="62" width="8" height="55" fill="#3A6A9F" rx="1"/>
  <rect x="125" y="68" width="7" height="48" fill="#2E5A8F" rx="1"/>

  <!-- Top roof accents -->
  <polygon points="76,52 84,42 90,52" fill="#C9A227" opacity="0.9"/>
  <polygon points="90,45 100,35 108,45" fill="#C9A227" opacity="0.85"/>
  <polygon points="108,55 115,48 120,55" fill="#C9A227" opacity="0.9"/>

  <!-- Subtle gold window lines for premium feel -->
  <line x1="82" y1="68" x2="82" y2="115" stroke="#E8D48B" stroke-width="1.5" opacity="0.6"/>
  <line x1="96" y1="60" x2="96" y2="118" stroke="#E8D48B" stroke-width="1.5" opacity="0.6"/>
  <line x1="114" y1="70" x2="114" y2="112" stroke="#E8D48B" stroke-width="1.5" opacity="0.6"/>

  <!-- Subtle outer gold rim highlight -->
  <path d="M42 28 L158 28 Q182 52 182 87 Q182 128 153 152 L47 152 Q22 128 22 87 Q22 52 42 28" 
        fill="none" stroke="#C9A227" stroke-width="2.5" opacity="0.35"/>
</svg>